name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - name: Validate skill packages
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          for name in ["website-qa", "figma-parity"]:
              root = Path("skill") / name
              text = (root / "SKILL.md").read_text()
              match = re.match(r"^---\n(.*?)\n---", text, re.S)
              assert match, f"{name}/SKILL.md needs YAML frontmatter"
              frontmatter = match.group(1)
              assert re.search(rf"^name: {re.escape(name)}$", frontmatter, re.M)
              assert re.search(r"^description:", frontmatter, re.M)
              keys = re.findall(r"^([a-z_]+):", frontmatter, re.M)
              assert keys == ["name", "description"], f"Unexpected {name} frontmatter keys: {keys}"
              agent = (root / "agents/openai.yaml").read_text()
              assert f"${name}" in agent
          PY
