name: Ofsted collection diagnostic

on:
  pull_request:
    paths:
      - "scripts/ofsted_diagnostic.py"
      - ".github/workflows/ofsted-diagnostic.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - run: python scripts/ofsted_diagnostic.py
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: ofsted-collection-diagnostic
          path: ofsted-diagnostic
          if-no-files-found: error
          retention-days: 3
